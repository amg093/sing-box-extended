name: Check Archive Structure

on:
  workflow_dispatch:

jobs:
  check-folders:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and List Structure
        run: |
          # 1. Скачиваем архив вашей ветки extended
          curl -L https://github.com -o repo.zip
          unzip repo.zip
          
          # 2. Выводим список всех файлов и папок, которые распаковались
          echo "=== СПИСОК ВСЕХ ФАЙЛОВ И ПАПОК В АРХИВЕ ==="
          find . -maxdepth 3 -not -path '*/.*'
