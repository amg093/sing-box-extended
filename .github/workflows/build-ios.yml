name: Build sing-box for iOS (NathanLR)

on:
  workflow_dispatch:

# Явно даем права на чтение и запись контента для работы Git
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04 # Фиксируем стабильную версию ОС вместо ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачивает всю историю для корректной работы тегов и Git

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build iOS Binary
        run: |
          export GOOS=darwin
          export GOARCH=arm64
          export CGO_ENABLED=0
          
          go build -v -o sing-box-extended-ios \
            -trimpath \
            -ldflags "-s -w -X ://github.com" \
            ./cmd/sing-box

      - name: Prepare DEB Package Structure
        run: |
          mkdir -p deb-package/var/jb/usr/bin
          mkdir -p deb-package/DEBIAN
          
          cp sing-box-extended-ios deb-package/var/jb/usr/bin/sing-box
          chmod +x deb-package/var/jb/usr/bin/sing-box

          cat <<EOF > deb-package/DEBIAN/control
          Package: org.sagernet.singbox.extended
          Name: sing-box (Extended)
          Version: 1.14.1-extended
          Architecture: iphoneos-arm64
          Description: The universal proxy platform with extended features.
          Maintainer: Developer
          Author: shtorm-7
          Section: Utilities
          Priority: optional
          EOF

      - name: Build DEB Package
        run: |
          dpkg-deb --build --root-owner-group deb-package sing-box-extended-ios.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ios-deb
          path: sing-box-extended-ios.deb
